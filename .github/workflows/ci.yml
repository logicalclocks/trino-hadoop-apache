name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 24
          cache: 'maven'
      - name: Create Maven settings
        run: |
          mkdir -p ~/.m2
          echo "${{ secrets.MAVEN_SETTINGS_BASE64 }}" | base64 -d > ~/.m2/settings.xml
      - name: Build (Pull Request)
        if: github.event_name == 'pull_request'
        run: mvn clean install -B -DskipTests
      - name: Build (Push - No Deploy)
        if: github.event_name == 'push' && (github.repository != 'logicalclocks/trino-hadoop-apache' || (!startsWith(github.ref, 'refs/heads/branch-') && github.ref != 'refs/heads/master'))
        run: mvn clean install -B -DskipTests
      - name: Build and Deploy (Push to release branches on logicalclocks) 
        if: github.event_name == 'push' && github.repository == 'logicalclocks/trino-hadoop-apache' && (startsWith(github.ref, 'refs/heads/branch-') || github.ref == 'refs/heads/master')
        run: mvn clean install deploy -B -DskipTests

